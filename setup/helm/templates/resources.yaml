apiVersion: v1
kind: Secret
metadata:
  name: gitea-postgresql-credentials
  namespace: {{ .Values.gitea.namespace }}
type: Opaque
stringData:
  GITEA_ADMIN_PASSWORD: {{ required "gitea.admin.password is required" .Values.gitea.admin.password | quote }}
  POSTGRESQL_PASSWORD: {{ required "postgresql.auth.password is required" .Values.postgresql.auth.password | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql
  namespace: {{ .Values.gitea.namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgresql.persistence.size | quote }}
  {{- with .Values.postgresql.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea
  namespace: {{ .Values.gitea.namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.gitea.persistence.size | quote }}
  {{- with .Values.gitea.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: {{ .Values.gitea.namespace }}
spec:
  selector:
    app.kubernetes.io/name: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: {{ .Values.gitea.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-postgresql-credentials
                  key: POSTGRESQL_PASSWORD
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}, "-d", {{ .Values.postgresql.auth.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}, "-d", {{ .Values.postgresql.auth.database | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: {{ .Values.gitea.namespace }}
spec:
  selector:
    app.kubernetes.io/name: gitea
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: {{ .Values.gitea.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: init-config
          image: {{ .Values.gitea.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cp /gitea-config-src/app.ini /home/gitea/conf/app.ini
              printf '\nPASSWD = %s\n' "$GITEA_DB_PASSWD" >> /home/gitea/conf/app.ini
          env:
            - name: GITEA_DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: gitea-postgresql-credentials
                  key: POSTGRESQL_PASSWORD
          volumeMounts:
            - mountPath: /gitea-config-src
              name: gitea-config-src
            - mountPath: /home/gitea/conf
              name: gitea-conf
      containers:
        - name: gitea
          image: {{ .Values.gitea.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 1
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env: []
          resources:
            {{- toYaml .Values.gitea.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /gitea-repositories
              name: gitea-repositories
            - mountPath: /home/gitea/conf
              name: gitea-conf
      volumes:
        - name: gitea-repositories
          persistentVolumeClaim:
            claimName: gitea
        - name: gitea-conf
          emptyDir: {}
        - name: gitea-config-src
          configMap:
            name: gitea-config
            defaultMode: 420
            items:
              - key: app.ini
                path: app.ini
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-config
  namespace: {{ .Values.gitea.namespace }}
data:
  app.ini: |
    {{- .Values.gitea.appIni | nindent 4 }}
    [server]
    ROOT_URL = {{ printf "https://%s" .Values.gitea.rootUrl }}
    [database]
    DB_TYPE  = postgres
    HOST     = postgresql:5432
    NAME     = {{ .Values.postgresql.auth.database }}
    USER     = {{ .Values.postgresql.auth.username }}
    SSL_MODE = disable
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gitea
  namespace: {{ .Values.gitea.namespace }}
spec:
  host: {{ .Values.gitea.rootUrl | quote }}
  to:
    kind: Service
    name: gitea
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: datasphere-config
  namespace: {{ .Values.datasphere.namespace }}
data:
  config.json: |
    {"theme": {{ .Values.datasphere.theme | quote }}}
  extra_datacenters.json: |
    {{ .Values.datasphere.api.extraDatacenters | toJson }}
---
apiVersion: v1
kind: Service
metadata:
  name: datasphere-redis
  namespace: {{ .Values.datasphere.namespace }}
spec:
  selector:
    app.kubernetes.io/name: datasphere-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datasphere-redis
  namespace: {{ .Values.datasphere.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: datasphere-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datasphere-redis
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: redis
          image: {{ .Values.datasphere.redis.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            {{- toYaml .Values.datasphere.redis.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: datasphere-api
  namespace: {{ .Values.datasphere.namespace }}
spec:
  selector:
    app.kubernetes.io/name: datasphere-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datasphere-api
  namespace: {{ .Values.datasphere.namespace }}
spec:
  replicas: {{ .Values.datasphere.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: datasphere-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datasphere-api
      annotations:
        checksum/config: {{ dict "theme" .Values.datasphere.theme "extraDatacenters" .Values.datasphere.api.extraDatacenters | toJson | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ .Values.datasphere.api.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATASPHERE_CONFIG_PATH
              value: /etc/datasphere/config.json
            - name: REDIS_URL
              value: redis://datasphere-redis:6379
          resources:
            {{- toYaml .Values.datasphere.api.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/datasphere
      volumes:
        - name: config
          configMap:
            name: datasphere-config
---
apiVersion: v1
kind: Service
metadata:
  name: datasphere-ui
  namespace: {{ .Values.datasphere.namespace }}
spec:
  selector:
    app.kubernetes.io/name: datasphere-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datasphere-ui
  namespace: {{ .Values.datasphere.namespace }}
spec:
  replicas: {{ .Values.datasphere.ui.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: datasphere-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datasphere-ui
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ui
          image: {{ .Values.datasphere.ui.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.datasphere.ui.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: datasphere-ui
  namespace: {{ .Values.datasphere.namespace }}
spec:
  host: {{ .Values.datasphere.ui.rootUrl | quote }}
  to:
    kind: Service
    name: datasphere-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
{{- if .Values.datasphere.api.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: datasphere-api
  namespace: {{ .Values.datasphere.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: datasphere-api
  minReplicas: {{ .Values.datasphere.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.datasphere.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.datasphere.api.hpa.targetCPUUtilizationPercentage }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-admin-bootstrap
  namespace: {{ .Values.gitea.namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: init-config
          image: {{ .Values.gitea.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cat > /gitea-config/app.ini <<CFG
              [security]
              INSTALL_LOCK = true
              [database]
              DB_TYPE  = postgres
              HOST     = postgresql:5432
              NAME     = $GITEA_DB_NAME
              USER     = $GITEA_DB_USER
              PASSWD   = $GITEA_DB_PASSWD
              SSL_MODE = disable
              CFG
          env:
            - name: GITEA_DB_NAME
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: GITEA_DB_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: GITEA_DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: gitea-postgresql-credentials
                  key: POSTGRESQL_PASSWORD
          volumeMounts:
            - name: gitea-config
              mountPath: /gitea-config
      containers:
        - name: gitea-admin-bootstrap
          image: {{ .Values.gitea.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          workingDir: /home/gitea
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              attempts=0
              until ./gitea migrate --config /gitea-config/app.ini ; do
                attempts=$((attempts + 1))
                [ "$attempts" -lt 60 ] || exit 1
                sleep 2
              done
              output=$(./gitea admin user create --config /gitea-config/app.ini --admin --username "$GITEA_ADMIN_USERNAME" --password "$GITEA_ADMIN_PASSWORD" --email "$GITEA_ADMIN_EMAIL" 2>&1) && exit 0
              case "$output" in
                *"already exists"*) exit 0 ;;
                *) printf '%s\n' "$output" >&2; exit 1 ;;
              esac
          env:
            - name: GITEA_ADMIN_USERNAME
              value: {{ .Values.gitea.admin.username | quote }}
            - name: GITEA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-postgresql-credentials
                  key: GITEA_ADMIN_PASSWORD
            - name: GITEA_ADMIN_EMAIL
              value: {{ .Values.gitea.admin.email | quote }}
          volumeMounts:
            - name: gitea-config
              mountPath: /gitea-config
      volumes:
        - name: gitea-config
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: repo-seeding
  namespace: {{ .Values.gitea.namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: repo-seeding
          image: {{ .Values.repoSeed.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              echo "Waiting for Gitea to be ready..."
              until status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://gitea:3000/api/v1/version 2>/dev/null) && [ "$status" = "200" ]; do
                echo "  Gitea returned $status, retrying..."
                sleep 2
              done
              echo "Gitea is ready"
              workdir=$(mktemp -d)
              trap 'rm -rf "$workdir"' EXIT
              echo "Downloading archive from $REPO_SEED_ARCHIVE_URL"
              curl --fail --silent --location --show-error --output "$workdir/source.tar.gz" "$REPO_SEED_ARCHIVE_URL"
              echo "Extracting archive..."
              tar -xzf "$workdir/source.tar.gz" -C "$workdir"
              source_root=$(find "$workdir" -mindepth 1 -maxdepth 1 -type d -print -quit)
              echo "Source root: $source_root"
              [ -n "$source_root" ] || { echo "ERROR: no source root found"; exit 1; }

              seed_repo() {
                repo=$1 source_path=$2 create_payload=$3
                source_dir="$source_root/$source_path"
                echo "Seeding repo '$repo' from '$source_dir'"
                [ -d "$source_dir" ] || { echo "ERROR: source dir '$source_dir' not found"; return 1; }
                repo_url="http://gitea:3000/api/v1/repos/$GITEA_ADMIN_USERNAME/$repo"
                echo "  Checking if repo exists: $repo_url"
                status=$(curl --silent --show-error --output /tmp/response --write-out '%{http_code}' \
                  --user "$GITEA_ADMIN_USERNAME:$GITEA_ADMIN_PASSWORD" "$repo_url" || true)
                echo "  Check status: $status"
                case "$status" in
                  200) echo "  Repo already exists, skipping"; return ;;
                  404) ;;
                  *) cat /tmp/response >&2; return 1 ;;
                esac
                echo "  Creating repo with payload: $create_payload"
                create_url="http://gitea:3000/api/v1/user/repos"
                echo "  POST $create_url"
                status=$(curl --silent --show-error --output /tmp/response --write-out '%{http_code}' \
                  --user "$GITEA_ADMIN_USERNAME:$GITEA_ADMIN_PASSWORD" \
                  --header 'Content-Type: application/json' --request POST --data "$create_payload" \
                  "$create_url" || true)
                echo "  Create status: $status"
                echo "  Response body: $(cat /tmp/response)"
                case "$status" in
                  201) ;;
                  409) echo "  Repo already exists (409), skipping"; return ;;
                  *) return 1 ;;
                esac
                find "$source_dir" -type f | while IFS= read -r file; do
                  relative_path=${file#"$source_dir/"}
                  echo "  Uploading: $relative_path"
                  content=$(base64 < "$file" | tr -d '\n')
                  printf '{"content":"%s","message":"Seed from %s"}' "$content" "$REPO_SEED_COMMIT" | \
                    curl --fail --silent --show-error --user "$GITEA_ADMIN_USERNAME:$GITEA_ADMIN_PASSWORD" \
                      --header 'Content-Type: application/json' --request PUT --data-binary @- \
                      "$repo_url/contents/$relative_path"
                done
              }
              {{- range .Values.repoSeed.repositories }}
              seed_repo {{ .name | quote }} {{ .sourcePath | quote }} {{ printf "{\"name\": %s, \"private\": %t, \"default_branch\": \"main\"}" (.name | quote) .private | squote }}
              {{- end }}
          env:
            - name: REPO_SEED_ARCHIVE_URL
              value: {{ .Values.repoSeed.archiveUrl | quote }}
            - name: REPO_SEED_COMMIT
              value: {{ .Values.repoSeed.archiveCommit | quote }}
            - name: GITEA_ADMIN_USERNAME
              value: {{ .Values.gitea.admin.username | quote }}
            - name: GITEA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-postgresql-credentials
                  key: GITEA_ADMIN_PASSWORD
